dev18_features:
  permission: ""
  wasd-enabled: true
  camera-position:
    distance: 1.5
    world: world
    x: -187
    y: 100
    z: 347
    yaw: 190
    pitch: 0.0
  layout:
    title:
      name: "<gold><bold>Dev18 feature test</bold>"
      x: 0.0
      y: 1.15
      z: 3.5
      text-size: 0.9
    toggle_style:
      name: "<gray>Toggle style"
      x: -1.05
      y: 0.45
      z: 3.5
      text-size: 0.68
      hover-enlarge:
        enabled: true
        scale: 1.1
      toggle-content:
        enabled: true
        'off': "[ ] Toggle style"
        'on': "[x] Toggle style"
        on-commands:
          - "[actionbar] <green>Toggle is ON"
        off-commands:
          - "[actionbar] <red>Toggle is OFF"
      toggle-style:
        'off':
          color: "#ff6b6b"
          strikethrough: true
        'on':
          color: "#62e67a"
          bold: true
      hover-style:
        underlined: true
      pressed-style:
        text: "<yellow>Switching..."
        duration: 4
      stop-menu:
        enabled: false
    cooldown_button:
      name: "<aqua>Cooldown click"
      x: 0.0
      y: 0.45
      z: 3.5
      text-size: 0.68
      hover-enlarge:
        enabled: true
        scale: 1.1
      hover-style:
        color: "#ffffff"
        underlined: true
      pressed-style:
        text: "<green>Accepted"
        duration: 5
      cooldown:
        time: 5s
        denied:
          actionbar: "<red>Wait {cooldown.left}s before clicking again"
          message: "<gray>This button is on cooldown for {cooldown.left}s."
      command:
        - "[message] <green>Cooldown button command executed."
      stop-menu:
        enabled: false
    health_bar:
      type: bar-text
      x: 1.1
      y: 0.45
      z: 3.5
      text-size: 0.58
      value: "%player_health%"
      max: "20"
      segments: 20
      filled: "<green>|"
      empty: "<dark_gray>|"
      prefix: "<red>HP "
      suffix: " <gray>{value}/{max} ({percent}%)"
      hover-style:
        color: "#ffffff"
      stop-menu:
        enabled: false
    back:
      name: "<yellow>Back to dev12"
      x: -0.55
      y: -0.3
      z: 3.5
      text-size: 0.62
      hover-enlarge:
        enabled: true
        scale: 1.08
      next-menu:
        enabled: true
        menu: dev12_showcase
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    close:
      name: "<red>Close"
      x: 0.65
      y: -0.3
      z: 3.5
      text-size: 0.62
      hover-enlarge:
        enabled: true
        scale: 1.08
      stop-menu:
        enabled: true
        teleport:
          enabled: false
