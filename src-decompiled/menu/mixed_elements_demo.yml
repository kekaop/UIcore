mixed_elements_demo:
  permission: ""
  wasd-enabled: false
  camera-position:
    distance: 1.5
    world: world
    x: -187
    y: 100
    z: 347
    yaw: 190
    pitch: 0.0
  layout:
    title:
      name: "<yellow><bold>Mixed Text + Item Demo</bold>"
      x: 0.0
      y: 1.15
      z: 3.5
      text-size: 0.95
    subtitle:
      name: "<gray>Item previews can live inside the same menu layout."
      x: 0.0
      y: 0.78
      z: 3.5
      text-size: 0.55
    sword_preview:
      type: item
      material: DIAMOND_SWORD
      custom-model-data: 0
      scale: 0.55
      glow: true
      rotate: true
      rotate-speed: 2.0
      billboard: center
      x: -0.72
      y: 0.08
      z: 3.5
      hitbox:
        width: 0.8
        height: 0.8
        depth: 0.3
      hover-tooltip:
        type: actionbar
        text: "<aqua>Click the sword preview"
      hover-cursor:
        material: DIAMOND_SWORD
        scale: 1.1
      click-requirements:
        permissions:
          - customscreenmenu.demo.item
        placeholders:
          - placeholder: "%player_name%"
            operator: "!="
            value: ""
        denied:
          message: "<red>You need <yellow>customscreenmenu.demo.item</yellow> to use this item."
          actionbar: "<gray>Click denied by menu requirement."
          sound: minecraft:entity.villager.no
          commands:
            - "[message] <gray>Denied command example for item preview."
      command:
        - "[message] <green>Diamond sword preview clicked."
      command-delay: 1
      stop-menu:
        enabled: false
    item_label:
      name: "<aqua>Clickable ItemDisplay"
      x: -0.72
      y: -0.58
      z: 3.5
      text-size: 0.65
      hover-enlarge:
        enabled: true
        scale: 1.08
      hover-style:
        color: "#ffffff"
        underlined: true
    message_button:
      name: "<green>Text button"
      x: 0.72
      y: 0.1
      z: 3.5
      text-size: 0.8
      hover-enlarge:
        enabled: true
        scale: 1.12
      hover-style:
        color: "#ffffff"
        underlined: true
      pressed-style:
        color: "#2ecc71"
        bold: true
        duration: 3
      command:
        - "[message] <green>Text button clicked next to an item preview."
      command-delay: 1
      stop-menu:
        enabled: false
    toggle_mark:
      name: "❌"
      toggle-content:
        enabled: true
        'off': "❌"
        'on': "✅"
        on-commands:
          - "[message] <green>Toggle switched ON."
          - "[actionbar] <green>State: ON"
          # Example with a permission plugin:
          # - "[console] lp user %player_name% permission set customscreenmenu.demo.item true"
        off-commands:
          - "[message] <red>Toggle switched OFF."
          - "[actionbar] <red>State: OFF"
          # Example with a permission plugin:
          # - "[console] lp user %player_name% permission unset customscreenmenu.demo.item"
      refresh-menu:
        enabled: true
        delay: 3
      x: 0.0
      y: -0.58
      z: 3.5
      text-size: 0.82
      hover-enlarge:
        enabled: true
        scale: 1.15
      hover-tooltip:
        type: actionbar
        text: "<yellow>Click to toggle this element text"
      command:
        - "[message] <gray>Toggle element clicked."
      command-delay: 1
      stop-menu:
        enabled: false
    close:
      name: "<red>Close"
      x: 0.72
      y: -0.58
      z: 3.5
      text-size: 0.72
      hover-enlarge:
        enabled: true
        scale: 1.08
      stop-menu:
        enabled: true
        teleport:
          enabled: false
