demo_items_api:
  permission: ""
  wasd-enabled: true
  camera-position:
    distance: 1.5
    world: world
    x: -187
    y: 100
    z: 347
    yaw: 190
    pitch: 0.0
  layout:
    title:
      name: "<light_purple><bold>Items, text and API hooks</bold>"
      x: 0.0
      y: 1.18
      z: 3.5
      text-size: 0.78
    item_preview:
      type: item
      material: DIAMOND_SWORD
      custom-model-data: 0
      scale: 0.58
      glow: true
      rotate: true
      rotate-speed: 2.0
      billboard: center
      x: -0.78
      y: 0.28
      z: 3.5
      hitbox:
        width: 0.85
        height: 0.85
        depth: 0.3
      hover-tooltip:
        type: actionbar
        text: "<aqua>ItemDisplay supports custom-model-data and hitboxes."
      hover-cursor:
        enabled: true
        material: DIAMOND_SWORD
        custom-model-data: 0
        scale: 1.1
      command:
        - "[message] <green>Item preview clicked."
      stop-menu:
        enabled: false
    item_label:
      name: "<aqua>Clickable ItemDisplay"
      x: -0.78
      y: -0.36
      z: 3.5
      text-size: 0.58
      stop-menu:
        enabled: false
    api_note:
      name: "<white>API is player-scoped when Player is passed"
      x: 0.75
      y: 0.42
      z: 3.5
      text-size: 0.5
      hover-enlarge:
        enabled: true
        scale: 1.06
      hover-tooltip:
        type: actionbar
        text: "<gray>Use api.addElement(player, menu, element) for per-player UI."
      command:
        - "[message] <aqua>API supports open/close, add/remove/edit, input, state, refresh."
      stop-menu:
        enabled: false
    api_events:
      name: "<yellow>Event API list"
      x: 0.75
      y: -0.08
      z: 3.5
      text-size: 0.56
      hover-enlarge:
        enabled: true
        scale: 1.08
      pressed-style:
        text: "<green>Events fired"
        duration: 6
      command:
        - "[message] <yellow>Events: MenuOpen, MenuClose, MenuSwitch, MenuHover, MenuClick, MenuInput."
      stop-menu:
        enabled: false
    back:
      name: "<yellow>Back"
      x: -0.45
      y: -0.78
      z: 3.5
      text-size: 0.62
      hover-enlarge:
        enabled: true
        scale: 1.08
      next-menu:
        enabled: true
        menu: demo_main
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    close:
      name: "<red>Close"
      x: 0.55
      y: -0.78
      z: 3.5
      text-size: 0.62
      hover-enlarge:
        enabled: true
        scale: 1.08
      stop-menu:
        enabled: true
        teleport:
          enabled: false
