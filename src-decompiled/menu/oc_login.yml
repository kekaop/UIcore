oc_login:
  permission: ""
  wasd-enabled: false
  auto-commands:
    enabled: true
    commands:
      - "[actionbar] <yellow>Click password field, type password in chat, then click Login."
    delays:
      - 5
  camera-position:
    distance: 1.5
    world: world
    x: -187
    y: 100
    z: 347
    yaw: 190
    pitch: 0.0
  layout:
    title:
      name: "<gold><bold>OrvenCraft Login</bold>"
      x: 0.0
      y: 1.2
      z: 3.5
      text-size: 0.98
    account:
      name: "<gray>Account: <white>%player_name%"
      x: 0.0
      y: 0.78
      z: 3.5
      text-size: 0.62
    password_field:
      name: "<gray>Password: <white>%cursormenu_input_password%"
      x: 0.0
      y: 0.22
      z: 3.5
      text-size: 0.78
      hover-enlarge:
        enabled: true
        scale: 1.08
      hover-style:
        color: "#ffffff"
        underlined: true
      hover-tooltip:
        type: actionbar
        text: "<yellow>Type password in chat"
      command:
        - "[op] cmenu set_input_field password"
        - "[actionbar] <yellow>Type password in chat."
      command-delay: 1
      stop-menu:
        enabled: false
    toggle_visibility:
      name: "<yellow>Show / hide"
      x: -0.72
      y: -0.35
      z: 3.5
      text-size: 0.72
      hover-enlarge:
        enabled: true
        scale: 1.08
      command:
        - "[op] cmenu toggle_password_visibility"
      command-delay: 1
      stop-menu:
        enabled: false
    submit:
      name: "<green><bold>Login</bold>"
      x: 0.65
      y: -0.35
      z: 3.5
      text-size: 0.82
      hover-enlarge:
        enabled: true
        scale: 1.12
      hover-style:
        color: "#ffffff"
        underlined: true
      pressed-style:
        color: "#62e67a"
        bold: true
        duration: 3
      command:
        - "[op] cmenu login"
        - "[message] <gray>If login succeeded, open <green>MAIN_MENU</green> below."
      command-delay: 1
      stop-menu:
        enabled: false
    open_main_after_success:
      name: "<aqua>Open MAIN_MENU after success"
      x: 0.0
      y: -0.82
      z: 3.5
      text-size: 0.66
      hover-enlarge:
        enabled: true
        scale: 1.08
      next-menu:
        enabled: true
        menu: oc_main_menu
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    register:
      name: "<aqua>Create account"
      x: -0.8
      y: -1.2
      z: 3.5
      text-size: 0.62
      hover-enlarge:
        enabled: true
        scale: 1.08
      next-menu:
        enabled: true
        menu: oc_register
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    exit:
      name: "<red>Disconnect"
      x: 0.8
      y: -1.2
      z: 3.5
      text-size: 0.62
      hover-enlarge:
        enabled: true
        scale: 1.08
      command:
        - "[console] kick %player_name% Login cancelled."
      command-delay: 1
      stop-menu:
        enabled: true
        teleport:
          enabled: false
