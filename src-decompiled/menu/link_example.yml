link_example:
  permission: cursormenu.menu.link_example
  camera-position:
    distance: 1.5
    world: world
    x: 0
    y: 70
    z: 0
    yaw: 180
    pitch: 0.0
  layout:
    discord_link:
      name: "Discord"
      x: -1
      y: 1
      z: 3
      style:
        color: "#55ffff"
      hover-style:
        color: "#ffffff"
        underlined: true
        transition:
          type: smooth
          duration: 5
      pressed-style:
        color: "#00c8ff"
        bold: true
        duration: 3
      hover-tooltip:
        type: actionbar
        text: "<aqua>Click to send an open-url chat link"
      hover-cursor:
        material: WRITABLE_BOOK
        scale: 1.1
      command: []
      link: "[link]https://discord.gg/example|<aqua><underlined>Open Discord</underlined></aqua>"
      stop-menu:
        enabled: false
      next-menu:
        enabled: false
    
    qq_group_link:
      name: "加入官方 QQ 群"
      x: -1
      y: 0.5
      z: 3
      command: []
      link: "[link]https://qm.qq.com/q/example|点击加入官方 QQ 群"
      stop-menu:
        enabled: false
      next-menu:
        enabled: false
        
    website_link:
      name: "访问我们的官网"
      x: -1
      y: 0
      z: 3
      command: []
      link: "[link]https://www.example.com|点击访问我们的官网"
      stop-menu:
        enabled: false
      next-menu:
        enabled: false
        
    normal_command:
      name: "MiniMessage message"
      x: -1
      y: -0.5
      z: 3
      style:
        color: "#62e67a"
      hover-style:
        color: "#ffffff"
        bold: true
      pressed-style:
        color: "#2ecc71"
        underlined: true
        duration: 3
      command:
        - "[message] <green>MiniMessage works: <click:open_url:'https://modrinth.com/plugin/customscreenmenu'><aqua><underlined>open page</underlined></aqua></click>"
      stop-menu:
        enabled: false
      next-menu:
        enabled: false
