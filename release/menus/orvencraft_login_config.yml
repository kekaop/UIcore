# ФРАГМЕНТ plugins/UIcore/config.yml. Не помещать этот файл в menu/.
# Перенесите указанные поля в существующие разделы config.yml, сохраняя остальные значения.
# join-run: открытие при входе. commands пустой, чтобы пример не телепортировал игрока.
join-run:
  enabled: true
  delay: 3
  menu: oc_login
  commands: []

# Плавный эффект движения камеры возле краёв экрана.
# Настоящий динамический tilt элементов текущим YAML не поддерживается.
# Здесь используется уже реализованный edge-pan; статический tilt аватара задан в меню.
cursor-item:
  scale: 0.22
  z-offset: 1.0
  edge-pan:
    enabled: true
    threshold: 0.64
    max-offset:
      x: 0.14
      y: 0.08
    smoothing: 0.08

# Нужен только для кнопки подтверждения выхода с сервера.
# Сохраните уже имеющиеся разрешённые команды и добавьте minecraft:kick.
security:
  allow-console-commands: true
  console-command-allowlist:
    - minecraft:kick
