# OrvenCraft — стартовое меню для UIcore. Без ресурс-пака.
# Открыть: /uicore run oc_login
# Этот файл содержит все 6 экранов. Положите его целиком в plugins/UIcore/menu/.
# Перемещение камеры у краёв уже есть в config.yml: cursor-item.edge-pan.
# Сопутствующие настройки: orvencraft_login_config.yml (НЕ класть в menu/).
# Статистика, друзья и онлайн режимов — демонстрационные числа.
# Настройки — демонстрационные переключатели UIcore, без подключения к системе друзей/уведомлений.
# Реальные команды своих плагинов добавьте в toggle-content.on-commands/off-commands.
# Выбор режима пока закрывает меню и возвращает игрока в мир.
# Для сети у нужного режима добавьте stop-menu.command.enabled: true и
# stop-menu.command.list: ["[server] survival"] (или creative / arena).
# Для выхода нужен точечный доступ к minecraft:kick из сопутствующего config-фрагмента.
# Карточки без glow: не вызывают обводку/эффекты других плагинов.

