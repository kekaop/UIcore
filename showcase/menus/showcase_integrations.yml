showcase_integrations:
  permission: ""
  wasd-enabled: false
  camera-position:
    type: player
    distance: 1.5
  layout:
    title:
      name: "<green><bold>Built-in integrations"
      x: 0.0
      y: 1.05
      z: 3.5
      text-size: 0.72
    balance:
      name: "<gold>Balance: <white>{vault:formatted-balance}"
      x: 0.0
      y: 0.52
      z: 3.5
      text-size: 0.5
    vault_gate:
      name: "<yellow>Vault balance check passed"
      x: 0.0
      y: 0.12
      z: 3.5
      text-size: 0.48
      visible-if:
        custom:
          type: vault:has-balance
          amount: 100
    rank:
      name: "<aqua>Group: <white>{luckperms:primary-group}"
      x: 0.0
      y: -0.23
      z: 3.5
      text-size: 0.5
    prefix:
      name: "<gray>Prefix: <white>{luckperms:prefix}"
      x: 0.0
      y: -0.55
      z: 3.5
      text-size: 0.44
    back:
      name: "<gray>Back"
      x: -0.45
      y: -1.0
      z: 3.5
      text-size: 0.5
      next-menu: { enabled: true, menu: showcase_main }
      stop-menu: { enabled: false }
    close:
      name: "<red>Close"
      x: 0.55
      y: -1.0
      z: 3.5
      text-size: 0.5
      stop-menu:
        enabled: true
        teleport:
          enabled: false
