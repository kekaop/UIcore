showcase_drag:
  permission: ""
  wasd-enabled: false
  camera-position:
    type: player
    distance: 1.5
  layout:
    title:
      name: "<yellow><bold>Dragging"
      x: 0.0
      y: 1.05
      z: 3.5
      text-size: 0.78
    item_one:
      name: "<green>Group item one"
      drag-group: showcase-group
      x: -0.75
      y: 0.35
      z: 3.5
      text-size: 0.52
    item_two:
      name: "<aqua>Group item two"
      drag-group: showcase-group
      x: -0.75
      y: -0.05
      z: 3.5
      text-size: 0.52
    move_group:
      name: "<yellow>Hold to move the group"
      x: -0.75
      y: -0.55
      z: 3.5
      text-size: 0.46
      hitbox: { width: 1.55, height: 0.55, depth: 0.3 }
      drag:
        mode: move-group
        group: showcase-group
        sensitivity: 1.0
    model:
      type: item
      material: DIAMOND_SWORD
      x: 0.85
      y: 0.2
      z: 3.5
      scale: 0.65
      hitbox: { width: 0.8, height: 0.8, depth: 0.3 }
    rotate:
      name: "<gold>Hold to rotate the sword"
      x: 0.85
      y: -0.55
      z: 3.5
      text-size: 0.46
      hitbox: { width: 1.55, height: 0.55, depth: 0.3 }
      drag:
        mode: rotate-element
        target: model
        sensitivity: 1.0
    back:
      name: "<gray>Back"
      x: -0.45
      y: -1.0
      z: 3.5
      text-size: 0.5
      next-menu: { enabled: true, menu: showcase_main }
      stop-menu: { enabled: false }
    close:
      name: "<red>Close"
      x: 0.55
      y: -1.0
      z: 3.5
      text-size: 0.5
      stop-menu:
        enabled: true
        teleport:
          enabled: false
