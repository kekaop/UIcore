version: "1.4.8" # Do not edit manually.
Debug: false

# Show a pumpkin overlay while the player is inside a menu.
use-pumpkin-overlay: false

# Use the player's current position and facing as the menu camera.
# true  -> ignore camera-position in menu YAML and open the menu at the player.
# false -> use camera-position from menu YAML.
use-player-location: false

# Yaw/pitch restored when the player exits a menu.
exit-camera:
  yaw: 0.0
  pitch: 0.0

# Prevent mob spawning around menu camera locations.
creature-spawn-limits:
  enabled: false
  radius: 10

# Checks blocks around the camera/player to avoid blocked camera view.
camera-block-check:
  enabled: true
  radius: 1

# Button access markers used by the built-in auth/login flow.
# The plugin checks whether the layout name or layout key contains these tags.
button-access-control:
  login-required:
    name-tags:
      - "[LOGIN_REQUIRED]"
      - "%img_logo%"
    key-tags:
      - "login_required"
      - "%img_logo%"
  no-duplicate-registration:
    name-tags:
      - "%img_logo%"
      - "[NO_DUPLICATE_REG]"
    key-tags:
      - "no_duplicate_reg"
      - "no_duplicate_registration"

# IP binding security for the built-in auth system.
ip-binding:
  # Bind registered accounts to the first login IP.
  enabled: true
  # true blocks login when the IP does not match.
  # false only warns and still allows login.
  strict: false
  # Allow another account from the same IP to log in.
  allow-same-ip-login: true
  # Lockout duration in minutes after too many failed attempts.
  lockout-duration: 5
  # Maximum failed login attempts before lockout.
  max-login-attempts: 5

  whitelist:
    enabled: false
    # Supports plain IPs and CIDR ranges, for example 192.168.1.0/24.
    ips: []
      # - "192.168.1.1"
      # - "10.0.0.0/8"

  blacklist:
    enabled: false
    # Supports plain IPs and CIDR ranges.
    ips: []
      # - "192.168.1.100"
      # - "10.0.0.50"

  # OP/admin IP whitelist. Only applies when enabled.
  admin-ip-whitelist:
    enabled: false
    ips: []
      # - "192.168.1.1"
      # - "10.0.0.0/8"

messages:
  prefix: "&f[&eCustomScreenMenu&f] "
  command_blocked: "&cCommands are blocked while the menu camera is active!"

security:
  # Console commands from menu configuration are disabled by default.
  # Set this to true only for trusted private configs.
  allow-console-commands: false
  # Optional prefix allowlist. Empty list means all console commands are allowed
  # only when allow-console-commands is true.
  console-command-allowlist: []
  # Legacy OP-prefixed commands never grant temporary OP. If this is true,
  # they may run only when the clicking player is already OP.
  allow-op-commands-for-existing-ops: false
  # Logs denied privileged actions without spamming normal servers.
  debug-denied-commands: false

sound:
  name: "music.menu"
  volume: 1
  pitch: 1
  loop:
    enabled: true
    # Repeat interval in seconds.
    duration: 30

# Open a menu automatically when a player joins.
join-run:
  enabled: false
  delay: 3
  menu: "test"
  commands:
    - "[console] say Welcome %player% to the server!"
    - "[player] msg %player% Welcome to the server!"
    - "[player] spawn"

cursor-item:
  material: "ARROW"
  custom-model-data: 0
  scale: 0.5
  # Multiplies cursor movement from camera rotation.
  # Lower values move the cursor slower; higher values move it faster.
  sensitivity: 1.0
  # Cursor smoothing. 1.0 is immediate. Lower values are smoother but delayed.
  # The code clamps it to 0.01..1.0.
  smoothing: 1.0
  # Visual cursor item scale multiplier per axis.
  size:
    x: 1.0
    y: 1.0
    z: 1.0
  # Rotation-to-world-space conversion range.
  # With max-x: 2, 90 degrees of yaw equals 2 world blocks before sensitivity.
  max-x: 2
  # With max-y: 3, 90 degrees of pitch equals 3 world blocks before sensitivity.
  max-y: 3
  # Base cursor offset on the menu plane.
  x: 0.0
  y: 0.0
  # Extra distance from the camera/menu plane along the camera forward vector.
  z-offset: 0.0

  # Optional hard clamp for cursor coordinates on the menu plane.
  # These are world-space offsets relative to the menu camera basis:
  # X = horizontal offset on the camera right vector.
  # Y = vertical offset on the camera up vector.
  # Effective width  = x.max - x.min.
  # Effective height = y.max - y.min.
  movement-range:
    enabled: false
    x:
      min: -2.0
      max: 2.0
    y:
      min: -3.0
      max: 3.0

  # Initial cursor position when a menu opens.
  # If disabled, cursor-item.x/y are used.
  default-position:
    enabled: false
    x: 0.0
    y: 0.0
