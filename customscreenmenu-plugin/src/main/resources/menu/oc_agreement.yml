oc_agreement:
  permission: ""
  wasd-enabled: false
  auto-commands:
    enabled: true
    commands:
      - "[actionbar] <yellow>Accept the agreement before continuing."
    delays:
      - 5
  camera-position:
    distance: 1.5
    world: world
    x: -187
    y: 100
    z: 347
    yaw: 190
    pitch: 0.0
  layout:
    title:
      name: "<gold><bold>OrvenCraft Agreement</bold>"
      x: 0.0
      y: 1.25
      z: 3.5
      text-size: 1.0
    summary_1:
      name: "<gray>Test screen: rules, privacy, fair play and account safety."
      x: 0.0
      y: 0.88
      z: 3.5
      text-size: 0.56
    summary_2:
      name: "<gray>This menu checks checkbox, disabled button, link and exit flow."
      x: 0.0
      y: 0.62
      z: 3.5
      text-size: 0.52
    full_link:
      name: "<aqua><underlined>Open full agreement</underlined>"
      link: "[link]https://orvencraft.ru/rules|<aqua><underlined>Open OrvenCraft rules</underlined>"
      x: -1.15
      y: 0.12
      z: 3.5
      text-size: 0.68
      hover-enlarge:
        enabled: true
        scale: 1.08
      hover-tooltip:
        type: actionbar
        text: "<aqua>Client URL confirmation should appear in chat"
      command-delay: 1
      stop-menu:
        enabled: false
    accepted_checkbox:
      name: "[ ] I accept agreement v1"
      toggle-content:
        enabled: true
        'off': "[ ] I accept agreement v1"
        'on': "[x] I accept agreement v1"
        on-commands:
          - "[console] lp user %player_name% permission set orvencraft.ui.agreement.accepted true"
          - "[actionbar] <green>Agreement accepted for this test session."
        off-commands:
          - "[console] lp user %player_name% permission unset orvencraft.ui.agreement.accepted"
          - "[actionbar] <yellow>Agreement unchecked."
      x: 0.95
      y: 0.12
      z: 3.5
      text-size: 0.68
      hover-enlarge:
        enabled: true
        scale: 1.1
      hover-style:
        color: "#ffffff"
        underlined: true
        transition:
          type: smooth
          duration: 5
      pressed-style:
        color: "#62e67a"
        bold: true
        duration: 3
      hover-cursor:
        material: LIME_DYE
        scale: 1.08
      command-delay: 1
      next-menu:
        enabled: true
        menu: oc_agreement_accepted
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    continue:
      name: "<dark_gray>Continue (accept first)"
      x: -0.95
      y: -0.48
      z: 3.5
      text-size: 0.76
      hover-enlarge:
        enabled: true
        scale: 1.06
      command:
        - "[actionbar] <yellow>Accept the agreement first."
        - "[message] <gray>Click the checkbox before continuing."
      command-delay: 1
      stop-menu:
        enabled: false
    already_registered:
      name: "<aqua>I already have an account"
      x: 0.85
      y: -0.48
      z: 3.5
      text-size: 0.68
      hover-enlarge:
        enabled: true
        scale: 1.08
      next-menu:
        enabled: true
        menu: oc_login
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    exit:
      name: "<red>Disconnect"
      x: 0.0
      y: -1.05
      z: 3.5
      text-size: 0.7
      hover-enlarge:
        enabled: true
        scale: 1.08
      command:
        - "[console] kick %player_name% Agreement was not accepted."
      command-delay: 1
      stop-menu:
        enabled: true
        teleport:
          enabled: false
