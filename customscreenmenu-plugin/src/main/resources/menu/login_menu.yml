login_menu:
  permission: ""
  wasd-enabled: false
  auto-commands:
    enabled: true
    commands:
      - "[actionbar] <yellow>Click a field, then type the value in chat."
    delays:
      - 5
  camera-position:
    distance: 1.5
    world: world
    x: -187
    y: 100
    z: 347
    yaw: 190
    pitch: 0.0
  layout:
    title:
      name: "<yellow><bold>OrvenCraft Register</bold>"
      x: 0.0
      y: 1.20
      z: 3.5
      text-size: 1.05
    hint:
      name: "<gray>Password length: 6-12. Weak passwords are rejected."
      x: 0.0
      y: 0.86
      z: 3.5
      text-size: 0.55
    password_field:
      name: "<gray>Password: <white>%cursormenu_input_password%"
      x: 0.0
      y: 0.36
      z: 3.5
      text-size: 0.78
      hover-enlarge:
        enabled: true
        scale: 1.08
      command:
        - "[player] cmenu set_input_field password"
        - "[actionbar] <yellow>Type password in chat."
      command-delay: 1
      stop-menu:
        enabled: false
        teleport:
          enabled: false
    confirm_field:
      name: "<gray>Repeat: <white>%cursormenu_input_confirm_password%"
      x: 0.0
      y: -0.04
      z: 3.5
      text-size: 0.78
      hover-enlarge:
        enabled: true
        scale: 1.08
      command:
        - "[player] cmenu set_input_field confirm_password"
        - "[actionbar] <yellow>Repeat password in chat."
      command-delay: 1
      stop-menu:
        enabled: false
        teleport:
          enabled: false
    toggle_visibility:
      name: "<yellow>Show / hide"
      x: -0.82
      y: -0.50
      z: 3.5
      text-size: 0.72
      hover-enlarge:
        enabled: true
        scale: 1.08
      command:
        - "[player] cmenu toggle_password_visibility"
      command-delay: 1
      stop-menu:
        enabled: false
        teleport:
          enabled: false
    submit:
      name: "<green><bold>Register</bold>"
      x: 0.68
      y: -0.50
      z: 3.5
      text-size: 0.82
      hover-enlarge:
        enabled: true
        scale: 1.12
      command:
        - "[player] cmenu register_confirm"
      command-delay: 1
      stop-menu:
        enabled: false
        teleport:
          enabled: false
    login:
      name: "<aqua>I already have an account"
      x: -0.72
      y: -1.02
      z: 3.5
      text-size: 0.66
      hover-enlarge:
        enabled: true
        scale: 1.08
      next-menu:
        enabled: true
        menu: login
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    close:
      name: "<red>Close"
      x: 0.72
      y: -1.02
      z: 3.5
      text-size: 0.72
      hover-enlarge:
        enabled: true
        scale: 1.08
      stop-menu:
        enabled: true
        teleport:
          enabled: false
