login:
  permission: ""
  wasd-enabled: false
  auto-commands:
    enabled: true
    commands:
      - "[actionbar] <yellow>Click the password field, then type your password in chat."
    delays:
      - 5
  camera-position:
    distance: 1.5
    world: world
    x: -187
    y: 100
    z: 347
    yaw: 190
    pitch: 0.0
  layout:
    title:
      name: "<yellow><bold>OrvenCraft Login</bold>"
      x: 0.0
      y: 1.20
      z: 3.5
      text-size: 1.05
    hint:
      name: "<gray>Password is entered through chat and is not sent publicly."
      x: 0.0
      y: 0.86
      z: 3.5
      text-size: 0.55
    password_field:
      name: "<gray>Password: <white>%cursormenu_input_password%"
      x: 0.0
      y: 0.28
      z: 3.5
      text-size: 0.82
      hover-enlarge:
        enabled: true
        scale: 1.08
      hover-style:
        color: "#ffffff"
        underlined: true
      hover-tooltip:
        type: actionbar
        text: "<green>Click, then type your password in chat"
      command:
        - "[op] cmenu set_input_field password"
        - "[actionbar] <yellow>Type your password in chat."
      command-delay: 1
      stop-menu:
        enabled: false
        teleport:
          enabled: false
    toggle_visibility:
      name: "<yellow>Show / hide"
      x: -0.78
      y: -0.24
      z: 3.5
      text-size: 0.74
      hover-enlarge:
        enabled: true
        scale: 1.08
      command:
        - "[op] cmenu toggle_password_visibility"
      command-delay: 1
      stop-menu:
        enabled: false
        teleport:
          enabled: false
    submit:
      name: "<green><bold>Login</bold>"
      x: 0.64
      y: -0.24
      z: 3.5
      text-size: 0.82
      hover-enlarge:
        enabled: true
        scale: 1.12
      command:
        - "[op] cmenu login"
      command-delay: 1
      stop-menu:
        enabled: false
        teleport:
          enabled: false
    register:
      name: "<aqua>Create account"
      x: -0.68
      y: -0.82
      z: 3.5
      text-size: 0.72
      hover-enlarge:
        enabled: true
        scale: 1.08
      next-menu:
        enabled: true
        menu: login_menu
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    close:
      name: "<red>Close"
      x: 0.68
      y: -0.82
      z: 3.5
      text-size: 0.72
      hover-enlarge:
        enabled: true
        scale: 1.08
      stop-menu:
        enabled: true
        teleport:
          enabled: false
