oc_agreement_accepted:
  permission: ""
  wasd-enabled: false
  auto-commands:
    enabled: true
    commands:
      - "[actionbar] <green>Agreement accepted. Continue is now available."
    delays:
      - 5
  camera-position:
    distance: 1.5
    world: world
    x: -187
    y: 100
    z: 347
    yaw: 190
    pitch: 0.0
  layout:
    title:
      name: "<gold><bold>OrvenCraft Agreement</bold>"
      x: 0.0
      y: 1.25
      z: 3.5
      text-size: 1.0
    summary_1:
      name: "<gray>Test screen: rules, privacy, fair play and account safety."
      x: 0.0
      y: 0.88
      z: 3.5
      text-size: 0.56
    summary_2:
      name: "<gray>Checkbox state is accepted; click it again to revoke."
      x: 0.0
      y: 0.62
      z: 3.5
      text-size: 0.52
    full_link:
      name: "<aqua><underlined>Open full agreement</underlined>"
      link: "[link]https://orvencraft.ru/rules|<aqua><underlined>Open OrvenCraft rules</underlined>"
      x: -1.15
      y: 0.12
      z: 3.5
      text-size: 0.68
      hover-enlarge:
        enabled: true
        scale: 1.08
      hover-tooltip:
        type: actionbar
        text: "<aqua>Client URL confirmation should appear in chat"
      command-delay: 1
      stop-menu:
        enabled: false
    accepted_checkbox:
      name: "[x] I accept agreement v1"
      x: 0.95
      y: 0.12
      z: 3.5
      text-size: 0.68
      hover-enlarge:
        enabled: true
        scale: 1.1
      hover-style:
        color: "#ffffff"
        underlined: true
      hover-cursor:
        material: LIME_DYE
        scale: 1.08
      command:
        - "[console] lp user %player_name% permission unset orvencraft.ui.agreement.accepted"
        - "[actionbar] <yellow>Agreement unchecked."
      command-delay: 1
      next-menu:
        enabled: true
        menu: oc_agreement
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    continue:
      name: "<green><bold>Continue to registration</bold>"
      x: -0.95
      y: -0.48
      z: 3.5
      text-size: 0.76
      hover-enlarge:
        enabled: true
        scale: 1.12
      hover-style:
        color: "#ffffff"
        underlined: true
      pressed-style:
        color: "#2ecc71"
        bold: true
        duration: 3
      next-menu:
        enabled: true
        menu: oc_register
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    already_registered:
      name: "<aqua>I already have an account"
      x: 0.85
      y: -0.48
      z: 3.5
      text-size: 0.68
      hover-enlarge:
        enabled: true
        scale: 1.08
      next-menu:
        enabled: true
        menu: oc_login
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    exit:
      name: "<red>Disconnect"
      x: 0.0
      y: -1.05
      z: 3.5
      text-size: 0.7
      hover-enlarge:
        enabled: true
        scale: 1.08
      command:
        - "[console] kick %player_name% Agreement was not accepted."
      command-delay: 1
      stop-menu:
        enabled: true
        teleport:
          enabled: false
