demo_conditions:
  permission: ""
  wasd-enabled: true
  camera-position:
    distance: 1.5
    world: world
    x: -187
    y: 100
    z: 347
    yaw: 190
    pitch: 0.0
  layout:
    title:
      name: "<yellow><bold>Conditions and visibility</bold>"
      x: 0.0
      y: 1.18
      z: 3.5
      text-size: 0.78
    world_visible:
      name: "<green>Visible in world"
      x: -1.0
      y: 0.45
      z: 3.5
      text-size: 0.62
      visible-if:
        placeholder: "%player_world%"
        equals: world
      hover-enlarge:
        enabled: true
        scale: 1.08
      command:
        - "[message] <green>This element is visible because %player_world% equals world."
      stop-menu:
        enabled: false
    permission_visible:
      name: "<aqua>Visible with permission"
      x: 0.95
      y: 0.45
      z: 3.5
      text-size: 0.62
      visible-if:
        permission: customscreenmenu.demo.visible
      hover-enlarge:
        enabled: true
        scale: 1.08
      command:
        - "[message] <aqua>You have customscreenmenu.demo.visible."
      stop-menu:
        enabled: false
    click_requirement:
      name: "<light_purple>Click requirement"
      x: -1.0
      y: -0.15
      z: 3.5
      text-size: 0.62
      hover-enlarge:
        enabled: true
        scale: 1.08
      click-requirements:
        permissions:
          - customscreenmenu.demo.click
        placeholders:
          - placeholder: "%player_name%"
            operator: "!="
            value: ""
        denied:
          message: "<red>Missing click permission: customscreenmenu.demo.click"
          actionbar: "<gray>Click was denied by click-requirements."
          commands:
            - "[message] <gray>Denied click command example."
      command:
        - "[message] <green>Click requirement accepted."
      stop-menu:
        enabled: false
    api_state_note:
      name: "<gray>API state can drive visible-if"
      x: 0.95
      y: -0.15
      z: 3.5
      text-size: 0.52
      hover-tooltip:
        type: actionbar
        text: "<gray>Example: api.setState(player, \"demo_conditions\", \"page\", \"2\")"
      command:
        - "[message] <gray>visible-if supports state.page when another plugin sets it through the API."
      stop-menu:
        enabled: false
    state_page_two:
      name: "<green>State page 2 is active"
      x: 0.0
      y: -0.58
      z: 3.5
      text-size: 0.58
      visible-if:
        state.page: 2
      command:
        - "[message] <green>This is visible after API state page=2."
      stop-menu:
        enabled: false
    back:
      name: "<yellow>Back"
      x: -0.45
      y: -0.92
      z: 3.5
      text-size: 0.62
      hover-enlarge:
        enabled: true
        scale: 1.08
      next-menu:
        enabled: true
        menu: demo_main
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    close:
      name: "<red>Close"
      x: 0.55
      y: -0.92
      z: 3.5
      text-size: 0.62
      hover-enlarge:
        enabled: true
        scale: 1.08
      stop-menu:
        enabled: true
        teleport:
          enabled: false
