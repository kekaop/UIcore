oc_register:
  permission: ""
  wasd-enabled: false
  auto-commands:
    enabled: true
    commands:
      - "[actionbar] <yellow>Click a password field, then type the value in chat."
    delays:
      - 5
  camera-position:
    distance: 1.5
    world: world
    x: -187
    y: 100
    z: 347
    yaw: 190
    pitch: 0.0
  layout:
    title:
      name: "<gold><bold>Create OrvenCraft password</bold>"
      x: 0.0
      y: 1.25
      z: 3.5
      text-size: 0.95
    account:
      name: "<gray>Account: <white>%player_name%"
      x: 0.0
      y: 0.86
      z: 3.5
      text-size: 0.62
    requirements:
      name: "<gray>6-12 chars, not too simple. Password is masked in UI."
      x: 0.0
      y: 0.56
      z: 3.5
      text-size: 0.5
    password_field:
      name: "<gray>Password: <white>%cursormenu_input_password%"
      x: -0.55
      y: 0.08
      z: 3.5
      text-size: 0.72
      hover-enlarge:
        enabled: true
        scale: 1.08
      hover-style:
        color: "#ffffff"
        underlined: true
      hover-tooltip:
        type: actionbar
        text: "<yellow>Type password in chat"
      command:
        - "[op] cmenu set_input_field password"
        - "[actionbar] <yellow>Type password in chat."
      command-delay: 1
      stop-menu:
        enabled: false
    repeat_field:
      name: "<gray>Repeat: <white>%cursormenu_input_confirm_password%"
      x: 0.58
      y: 0.08
      z: 3.5
      text-size: 0.72
      hover-enlarge:
        enabled: true
        scale: 1.08
      hover-style:
        color: "#ffffff"
        underlined: true
      hover-tooltip:
        type: actionbar
        text: "<yellow>Repeat password in chat"
      command:
        - "[op] cmenu set_input_field confirm_password"
        - "[actionbar] <yellow>Repeat password in chat."
      command-delay: 1
      stop-menu:
        enabled: false
    toggle_visibility:
      name: "<yellow>Show / hide password"
      x: -0.75
      y: -0.42
      z: 3.5
      text-size: 0.66
      hover-enlarge:
        enabled: true
        scale: 1.08
      command:
        - "[op] cmenu toggle_password_visibility"
      command-delay: 1
      stop-menu:
        enabled: false
    submit:
      name: "<green><bold>Create account</bold>"
      x: 0.82
      y: -0.42
      z: 3.5
      text-size: 0.76
      hover-enlarge:
        enabled: true
        scale: 1.12
      hover-style:
        color: "#ffffff"
        underlined: true
      pressed-style:
        color: "#62e67a"
        bold: true
        duration: 3
      command:
        - "[op] cmenu register_confirm"
        - "[message] <gray>If registration succeeded, open <green>MAIN_MENU</green> below."
      command-delay: 1
      stop-menu:
        enabled: false
    open_main_after_success:
      name: "<aqua>Open MAIN_MENU after success"
      x: 0.0
      y: -0.88
      z: 3.5
      text-size: 0.66
      hover-enlarge:
        enabled: true
        scale: 1.08
      next-menu:
        enabled: true
        menu: oc_main_menu
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    back:
      name: "<yellow>Back to agreement"
      x: -1.05
      y: -1.2
      z: 3.5
      text-size: 0.62
      hover-enlarge:
        enabled: true
        scale: 1.08
      next-menu:
        enabled: true
        menu: oc_agreement
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    login:
      name: "<aqua>Login instead"
      x: 1.05
      y: -1.2
      z: 3.5
      text-size: 0.62
      hover-enlarge:
        enabled: true
        scale: 1.08
      next-menu:
        enabled: true
        menu: oc_login
      stop-menu:
        enabled: true
        teleport:
          enabled: false
