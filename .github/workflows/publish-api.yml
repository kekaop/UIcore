name: Stage UIcore API in Maven Central

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag containing the API release
        required: true
        default: api-v1.0.0

permissions:
  contents: read

concurrency:
  group: publish-uicore-api-1.0.0
  cancel-in-progress: false

jobs:
  stage-api:
    if: inputs.release_tag == 'api-v1.0.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - name: Set up JDK 21 and Maven Central credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD

      - name: Use Maven 3.9.16 for Central bundle compatibility
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apache-maven-3.9.16-bin.tar.gz"
          curl --fail --silent --show-error --location \
            'https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz' \
            --output "$archive"
          echo '831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  '"$archive" \
            | sha512sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

      - name: Check release coordinates
        shell: bash
        run: |
          set -euo pipefail
          git tag --points-at HEAD | grep -Fx 'api-v1.0.0'
          mvn --version | grep -F 'Apache Maven 3.9.16'
          version="$(mvn -q -ntp -pl uicore-api help:evaluate -Dexpression=project.version -DforceStdout)"
          group="$(mvn -q -ntp -pl uicore-api help:evaluate -Dexpression=project.groupId -DforceStdout)"
          test "$version" = '1.0.0'
          test "$group" = 'io.github.kekaop'
          [[ "$version" != *-SNAPSHOT ]]

      - name: Build and run all tests
        run: mvn -B -ntp clean verify

      - name: Check publishing secrets
        shell: bash
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$CENTRAL_TOKEN_USERNAME"
          test -n "$CENTRAL_TOKEN_PASSWORD"
          test -n "$GPG_PRIVATE_KEY"
          test -n "$GPG_PASSPHRASE"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Verify signing key and unlock GPG agent
        shell: bash
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user D291E02BD69C9C2D6B77A3C9EC619C915E42C024 \
            --armor --detach-sign --output "$RUNNER_TEMP/uicore-signing-check.asc" README.md
          gpg --batch --verify "$RUNNER_TEMP/uicore-signing-check.asc" README.md

      - name: Build and sign parent POM and API artifacts
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -Pcentral-release -pl uicore-api -am verify -DskipTests

      - name: Inspect artifacts and signatures
        run: python3 scripts/check-central-artifacts.py --require-signatures

      - name: Upload bundle for manual publishing in Central Portal
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: mvn -B -ntp -Pcentral-release -pl uicore-api -am deploy -DskipTests
