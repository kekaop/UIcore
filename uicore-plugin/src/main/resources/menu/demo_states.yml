# States and access. Use a non-OP player without uicore.demo.vip to show denials.
demo_states:
  permission: ""
  camera-position: { type: player, distance: 1.5 }
  npc: { enabled: false }
  layout:
    eyebrow:
      name: "<#94A3B8>03 / STATES & ACCESS"
      x: 0
      y: 1.18
      z: 3.5
      text-size: 0.3
      hitbox: { width: 0.02, height: 0.02, depth: 0.02 }
    title:
      name: "<gradient:#C4B5FD:#5EEAD4><bold>Make it react</bold></gradient>"
      x: 0
      y: 0.87
      z: 3.5
      text-size: 0.7
      entrance-animation: { enabled: true, from: top, duration: 12, distance: 0.3, easing: ease-out-cubic }
      hitbox: { width: 0.02, height: 0.02, depth: 0.02 }
    subtitle:
      name: "<#CBD5E1>Change text, items, and visibility together."
      x: 0
      y: 0.55
      z: 3.5
      text-size: 0.31
      hitbox: { width: 0.02, height: 0.02, depth: 0.02 }
    status:
      name: "Status"
      x: -0.6
      y: 0.2
      z: 3.5
      text-size: 0.5
      initial-state: idle
      states:
        idle: { text: "<#94A3B8>Awaiting activation" }
        active: { text: "<#5EEAD4>System online", style: { bold: true } }
      hitbox: { width: 0.02, height: 0.02, depth: 0.02 }
    badge:
      type: item
      material: COAL
      transform: gui
      billboard: fixed
      scale: 0.45
      rotate: false
      glow: false
      x: 1.05
      y: 0.15
      z: 3.5
      initial-state: idle
      states:
        idle: { material: COAL }
        active: { material: EMERALD }
      hitbox: { width: 0.5, height: 0.5, depth: 0.3 }
      hover-tooltip: { type: actionbar, text: "<#94A3B8>The same element changes from coal to emerald." }
    revealed:
      name: "Reward preview"
      x: -0.6
      y: -0.1
      z: 3.5
      text-size: 0.34
      initial-state: hidden
      states:
        hidden: { visible: false }
        shown: { visible: true, text: "<#C4B5FD>A hidden element is now visible." }
      hitbox: { width: 0.02, height: 0.02, depth: 0.02 }
    activate:
      name: "<#5EEAD4>[ Activate ]"
      x: -0.65
      y: -0.4
      z: 3.5
      text-size: 0.42
      hitbox: { width: 1.05, height: 0.27, depth: 0.25 }
      hover-style: { color: "#FFFFFF", underlined: true }
      hover-enlarge: { enabled: true, scale: 1.06 }
      set-states: { status: active, badge: active, revealed: shown }
      command: ["[actionbar] <#5EEAD4>Three elements changed with one click."]
    reset:
      name: "<#94A3B8>[ Reset ]"
      x: 0.65
      y: -0.4
      z: 3.5
      text-size: 0.42
      hitbox: { width: 1.05, height: 0.27, depth: 0.25 }
      hover-style: { color: "#FFFFFF", underlined: true }
      set-states: { status: idle, badge: idle, revealed: hidden }
      command: ["[actionbar] <#94A3B8>Text, material, and visibility restored."]
    vip:
      name: "[ VIP access ]"
      permission: uicore.demo.vip
      x: -0.82
      y: -0.76
      z: 3.5
      text-size: 0.38
      hitbox: { width: 1.3, height: 0.25, depth: 0.25 }
      permission-style:
        allowed: { color: "#FDE68A", bold: true }
        denied: { color: "#64748B", strikethrough: true }
      permission-denied:
        actionbar: "<#FCA5A5>This button requires uicore.demo.vip."
      hover-tooltip: { type: actionbar, text: "<#94A3B8>Permission changes this button's appearance and access." }
      command: ["[actionbar] <#FDE68A>VIP access accepted."]
    gated_click:
      name: "<#C4B5FD>[ Gated click ]"
      x: 0.82
      y: -0.76
      z: 3.5
      text-size: 0.38
      hitbox: { width: 1.3, height: 0.25, depth: 0.25 }
      hover-style: { color: "#FFFFFF", underlined: true }
      click-requirements:
        permissions: [uicore.demo.vip]
        denied: { actionbar: "<#FCA5A5>The button is visible, but this click needs uicore.demo.vip." }
      pressed-style: { text: "<#5EEAD4>Access granted!", duration: 8 }
      command: ["[actionbar] <#5EEAD4>Click requirement accepted."]
    home:
      name: "<#93C5FD>[ Home ]"
      x: -0.9
      y: -1.13
      z: 3.5
      text-size: 0.38
      hitbox: { width: 0.8, height: 0.26, depth: 0.25 }
      hover-style: { color: "#FFFFFF", underlined: true }
      next-menu: { enabled: true, menu: demo_main }
    gallery:
      name: "<#93C5FD>[ Gallery ]"
      x: 0
      y: -1.13
      z: 3.5
      text-size: 0.38
      hitbox: { width: 0.8, height: 0.26, depth: 0.25 }
      hover-style: { color: "#FFFFFF", underlined: true }
      next-menu: { enabled: true, menu: demo_gallery }
    close:
      name: "<#FCA5A5>[ Close ]"
      x: 0.9
      y: -1.13
      z: 3.5
      text-size: 0.38
      hitbox: { width: 0.8, height: 0.26, depth: 0.25 }
      hover-style: { color: "#FFFFFF", underlined: true }
      stop-menu:
        enabled: true
        teleport: { enabled: true, back-original: true }
