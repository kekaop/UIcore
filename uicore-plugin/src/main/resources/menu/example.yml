example:
  # Permission required to open this menu. Remove the key to allow everyone.
  permission: uicore.menu.example

  auto-commands:
    enabled: false
    commands:
      - "[console] say The lobby menu opened three seconds ago."
      - "[player] say This command runs after five seconds."
    delays:
      - 60
      - 100

  camera-position:
    distance: 1.5
    world: lobby
    x: -187
    y: 70
    z: 347
    yaw: 190
    pitch: 0.0

  layout:
    logo:
      permission: uicore.button.example.logo
      name: "%img_logo%"
      x: -2
      y: 1
      z: 3.5
      tilt:
        x: 0.0
        y: 0.0
        z: 0.0
      command-delay: 6
      hover-commands:
        - "[message] <gray>UIcore example menu</gray>"
      leave-commands: []
      next-menu:
        enabled: false
        menu: demo_main
      stop-menu:
        enabled: false
        teleport:
          enabled: false
          back-original: false
          world: world
          x: 0.0
          y: 64.0
          z: 0.0

    open_demo:
      permission: uicore.button.example.open
      name: "Open demo menu"
      x: -2
      y: 0.5
      z: 3.5
      tilt:
        x: 0.0
        y: 0.0
        z: 0.0
      hover-enlarge:
        enabled: true
        scale: 1.1
      hover-sound:
        name: "minecraft:block.lever.click"
        volume: 0.8
        pitch: 1.2
        cooldown: 20
      text-size: 1.2
      command:
        - "[message] <green>Opening the demo menu.</green>"
      command-delay: 6
      next-menu:
        enabled: true
        menu: demo_main
      stop-menu:
        enabled: false

    mixed_elements:
      permission: uicore.button.example.mixed
      name: "Text and item displays"
      x: -2
      y: 0.0
      z: 3.5
      hover-enlarge:
        enabled: true
        scale: 1.1
      command:
        - "[player] say Opening mixed elements demo"
      next-menu:
        enabled: true
        menu: mixed_elements_demo
      stop-menu:
        enabled: false

    credits:
      permission: uicore.button.example.credits
      name: "Credits"
      x: -2
      y: -0.5
      z: 3.5
      hover-enlarge:
        enabled: true
        scale: 1.1
      typewriter:
        enabled: true
        speed: 2
        start-delay: 10
        cursor-char: "|"
      command:
        - "[message] <yellow>UIcore menu example.</yellow>"
      next-menu:
        enabled: false
        menu: example
      stop-menu:
        enabled: false

    close:
      permission: uicore.button.example.close
      name: "Close menu"
      x: -2
      y: -1.0
      z: 3.5
      hover-enlarge:
        enabled: true
        scale: 1.1
      command:
        - "[message] <red>Menu closed.</red>"
      command-delay: 6
      next-menu:
        enabled: false
        menu: example
      stop-menu:
        enabled: true
        teleport:
          enabled: false
          back-original: true
