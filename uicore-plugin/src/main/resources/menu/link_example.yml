link_example:
  permission: uicore.menu.link_example
  camera-position:
    distance: 1.5
    world: world
    x: 0
    y: 70
    z: 0
    yaw: 180
    pitch: 0.0
  layout:
    discord_link:
      name: "Discord"
      x: -1
      y: 1
      z: 3
      style:
        color: "#55ffff"
      hover-style:
        color: "#ffffff"
        underlined: true
        transition:
          type: smooth
          duration: 5
      pressed-style:
        color: "#00c8ff"
        bold: true
        duration: 3
      hover-tooltip:
        type: actionbar
        text: "<aqua>Click to send an open-url chat link"
      hover-cursor:
        material: WRITABLE_BOOK
        scale: 1.1
      command: []
      link: "[link]https://discord.gg/example|<aqua><underlined>Open Discord</underlined></aqua>"
      stop-menu:
        enabled: false
      next-menu:
        enabled: false
    
    community_link:
      name: "Community page"
      x: -1
      y: 0.5
      z: 3
      command: []
      link: "[link]https://example.com/community|<aqua><underlined>Open community page</underlined></aqua>"
      stop-menu:
        enabled: false
      next-menu:
        enabled: false
        
    website_link:
      name: "Project website"
      x: -1
      y: 0
      z: 3
      command: []
      link: "[link]https://www.example.com|<green><underlined>Open website</underlined></green>"
      stop-menu:
        enabled: false
      next-menu:
        enabled: false
        
    normal_command:
      name: "MiniMessage message"
      x: -1
      y: -0.5
      z: 3
      style:
        color: "#62e67a"
      hover-style:
        color: "#ffffff"
        bold: true
      pressed-style:
        color: "#2ecc71"
        underlined: true
        duration: 3
      command:
        - "[message] <green>MiniMessage works: <click:open_url:'https://www.example.com'><aqua><underlined>open page</underlined></aqua></click>"
      stop-menu:
        enabled: false
      next-menu:
        enabled: false
