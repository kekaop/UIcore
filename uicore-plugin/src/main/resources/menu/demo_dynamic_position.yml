demo_dynamic_position:
  permission: ""
  wasd-enabled: false
  camera-position:
    type: player
    distance: 1.5
  layout:
    title:
      name: "<gold><bold>Dynamic coordinates</bold>"
      x: 0.0
      y: 0.9
      z: 3.5
      text-size: 0.75

    horizontal:
      name: "<aqua>Time-driven movement"
      x: "0.9 * sin(t * 1.4)"
      y: 0.25
      z: 3.5
      text-size: 0.5
      position-update:
        interval: 1
        smoothing: 0.18
        clamp:
          x: [-1.0, 1.0]
      hover-style:
        color: "#80ffff"
        underlined: true
      command:
        - "[actionbar] <aqua>The moving hitbox follows the text."
      stop-menu:
        enabled: false

    rising:
      name: "<green>y = 0.25 * t (clamped)"
      x: -1.15
      y: "0.25 * t"
      z: 3.5
      text-size: 0.42
      position-update:
        interval: 1
        smoothing: 0.12
        fallback:
          y: -0.35
        clamp:
          y: [-0.35, 0.55]

    rotating_item:
      type: item
      material: COMPASS
      x: "0.55 * cos(t)"
      y: -0.3
      z: 3.5
      scale: 0.5
      rotate: true
      rotate-speed: 2.0
      hitbox:
        width: 0.8
        height: 0.8
        depth: 0.3
      position-update:
        interval: 1
        smoothing: 0.2
      hover-tooltip:
        type: actionbar
        text: "<yellow>ItemDisplay and hitbox move together"
      command:
        - "[message] <yellow>Dynamic item clicked."
      stop-menu:
        enabled: false

    close:
      name: "<red>Close"
      x: 0.0
      y: -0.85
      z: 3.5
      text-size: 0.55
      hover-style:
        color: "#ff7777"
        underlined: true
      stop-menu:
        enabled: true
        teleport:
          enabled: true
          back-original: true
