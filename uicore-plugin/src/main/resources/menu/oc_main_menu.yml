oc_main_menu:
  permission: ""
  auto-commands:
    enabled: true
    commands:
      - "[actionbar] <green>MAIN_MENU opened. Hover and left click buttons."
    delays:
      - 5
  camera-position:
    distance: 1.5
    world: world
    x: -187
    y: 100
    z: 347
    yaw: 190
    pitch: 0.0
  layout:
    logo:
      name: "<gold><bold>OrvenCraft</bold>"
      x: 0.0
      y: 1.3
      z: 3.5
      text-size: 1.25
    subtitle:
      name: "<gray>Test world menu stand: navigation, state, profile, friends, links."
      x: 0.0
      y: 0.92
      z: 3.5
      text-size: 0.52
    play:
      name: "<green><bold>Start playing</bold>"
      x: -1.1
      y: 0.28
      z: 3.5
      text-size: 0.82
      hover-enlarge:
        enabled: true
        scale: 1.12
      hover-style:
        color: "#ffffff"
        underlined: true
        transition:
          type: smooth
          duration: 5
      pressed-style:
        color: "#62e67a"
        bold: true
        duration: 3
      hover-tooltip:
        type: actionbar
        text: "<green>Open PROFILE_SELECT"
      hover-cursor:
        material: EMERALD
        scale: 1.1
      next-menu:
        enabled: true
        menu: oc_profile_select
      stop-menu:
        enabled: true
        teleport:
          enabled: false
