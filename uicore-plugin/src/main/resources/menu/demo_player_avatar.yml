demo_player_avatar:
  permission: ""
  wasd-enabled: false
  camera-position:
    type: player
    distance: 1.5
    offset:
      right: 0.0
      up: 0.0
      forward: 0.0
    yaw-offset: 0.0
    pitch-offset: 0.0
  layout:
    title:
      name: "<gold><bold>Player avatar</bold>"
      x: 0.0
      y: 1.0
      z: 3.5
      text-size: 0.72
    avatar:
      type: player-avatar
      # self, viewer, @s, player name, UUID, or a PlaceholderAPI result.
      player: self
      # Compress the head's depth to show the skin's face without a resource pack.
      # Set false to show the full 3D head instead.
      face-only: true
      scale: 0.9
      billboard: center
      rotate: false
      rotate-speed: 0.6
      tilt: { x: 0.0, y: 0.0, z: 0.0 }
      glow: false
      x: 0.0
      y: 0.15
      z: 3.5
      hitbox:
        width: 0.9
        height: 0.9
        depth: 0.4
      hover-tooltip:
        type: actionbar
        text: "<aqua>This is your current Minecraft skin."
      command:
        - "[message] <green>Avatar selected."
      stop-menu:
        enabled: false
    close:
      name: "<red>Close"
      x: 0.0
      y: -0.85
      z: 3.5
      text-size: 0.58
      hover-style:
        color: "#ff7777"
        underlined: true
      stop-menu:
        enabled: true
        teleport:
          enabled: true
          back-original: true
