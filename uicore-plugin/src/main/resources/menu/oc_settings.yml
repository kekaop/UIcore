oc_settings:
  permission: ""
  camera-position:
    distance: 1.5
    world: world
    x: -187
    y: 100
    z: 347
    yaw: 190
    pitch: 0.0
  layout:
    title:
      name: "<gold><bold>SETTINGS</bold>"
      x: 0.0
      y: 1.25
      z: 3.5
      text-size: 0.98
    note:
      name: "<gray>Toggle buttons write demo state into LuckPerms permissions."
      x: 0.0
      y: 0.94
      z: 3.5
      text-size: 0.48
    hints:
      name: "<white>Hints: OFF"
      toggle-content:
        enabled: true
        'off': "Hints: OFF"
        'on': "Hints: ON"
        on-commands:
          - "[console] lp user %player_name% permission set orvencraft.ui.settings.hints true"
          - "[console] lp user %player_name% permission set orvencraft.ui.settings.dirty true"
          - "[actionbar] <green>Hints enabled"
        off-commands:
          - "[console] lp user %player_name% permission unset orvencraft.ui.settings.hints"
          - "[console] lp user %player_name% permission set orvencraft.ui.settings.dirty true"
          - "[actionbar] <yellow>Hints disabled"
      refresh-menu:
        enabled: true
        delay: 3
      x: -1.2
      y: 0.44
      z: 3.5
      text-size: 0.66
      hover-enlarge:
        enabled: true
        scale: 1.08
      command-delay: 1
      stop-menu:
        enabled: false
    language:
      name: "<white>Language: RU"
      toggle-content:
        enabled: true
        'off': "Language: RU"
        'on': "Language: EN"
        on-commands:
          - "[console] lp user %player_name% permission set orvencraft.ui.settings.lang.en true"
          - "[console] lp user %player_name% permission set orvencraft.ui.settings.dirty true"
          - "[actionbar] <aqua>Draft language: English"
        off-commands:
          - "[console] lp user %player_name% permission unset orvencraft.ui.settings.lang.en"
          - "[console] lp user %player_name% permission set orvencraft.ui.settings.dirty true"
          - "[actionbar] <yellow>Draft language: Russian"
      refresh-menu:
        enabled: true
        delay: 3
      x: 0.8
      y: 0.44
      z: 3.5
      text-size: 0.66
      hover-enlarge:
        enabled: true
        scale: 1.08
      command-delay: 1
      stop-menu:
        enabled: false
    effects:
      name: "<white>Effects: medium/high"
      toggle-content:
        enabled: true
        'off': "Effects: MEDIUM"
        'on': "Effects: HIGH"
        on-commands:
          - "[console] lp user %player_name% permission set orvencraft.ui.settings.effects.high true"
          - "[console] lp user %player_name% permission set orvencraft.ui.settings.dirty true"
          - "[actionbar] <gold>Draft effects: high"
        off-commands:
          - "[console] lp user %player_name% permission unset orvencraft.ui.settings.effects.high"
          - "[console] lp user %player_name% permission set orvencraft.ui.settings.dirty true"
          - "[actionbar] <yellow>Draft effects: medium"
      refresh-menu:
        enabled: true
        delay: 3
      x: -1.2
      y: -0.02
      z: 3.5
      text-size: 0.66
      hover-enlarge:
        enabled: true
        scale: 1.08
      command-delay: 1
      stop-menu:
        enabled: false
    notifications:
      name: "<white>Friend notifications: OFF"
      toggle-content:
        enabled: true
        'off': "Friend notifications: OFF"
        'on': "Friend notifications: ON"
        on-commands:
          - "[console] lp user %player_name% permission set orvencraft.ui.settings.notifications true"
          - "[console] lp user %player_name% permission set orvencraft.ui.settings.dirty true"
          - "[actionbar] <green>Friend notifications enabled"
        off-commands:
          - "[console] lp user %player_name% permission unset orvencraft.ui.settings.notifications"
          - "[console] lp user %player_name% permission set orvencraft.ui.settings.dirty true"
          - "[actionbar] <yellow>Friend notifications disabled"
      refresh-menu:
        enabled: true
        delay: 3
      x: 0.8
      y: -0.02
      z: 3.5
      text-size: 0.66
      hover-enlarge:
        enabled: true
        scale: 1.08
      command-delay: 1
      stop-menu:
        enabled: false
    apply:
      name: "<green><bold>Apply</bold>"
      x: -1.1
      y: -0.76
      z: 3.5
      text-size: 0.72
      hover-enlarge:
        enabled: true
        scale: 1.12
      command:
        - "[console] lp user %player_name% permission unset orvencraft.ui.settings.dirty"
        - "[message] <green>Settings applied. Current values are stored as demo permissions."
      command-delay: 1
      stop-menu:
        enabled: false
    reset:
      name: "<yellow>Reset"
      x: 0.0
      y: -0.76
      z: 3.5
      text-size: 0.72
      hover-enlarge:
        enabled: true
        scale: 1.12
      command:
        - "[console] lp user %player_name% permission unset orvencraft.ui.settings.hints"
        - "[console] lp user %player_name% permission unset orvencraft.ui.settings.lang.en"
        - "[console] lp user %player_name% permission unset orvencraft.ui.settings.effects.high"
        - "[console] lp user %player_name% permission unset orvencraft.ui.settings.notifications"
        - "[console] lp user %player_name% permission set orvencraft.ui.settings.dirty true"
        - "[message] <yellow>Settings reset to defaults. Click Apply to clear dirty state."
      command-delay: 1
      stop-menu:
        enabled: false
    back:
      name: "<aqua>Back"
      x: 1.1
      y: -0.76
      z: 3.5
      text-size: 0.72
      hover-enlarge:
        enabled: true
        scale: 1.12
      next-menu:
        enabled: true
        menu: oc_main_menu
      stop-menu:
        enabled: true
        teleport:
          enabled: false
