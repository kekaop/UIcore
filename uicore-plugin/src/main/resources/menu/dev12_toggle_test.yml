dev12_toggle_test:
  permission: ""
  wasd-enabled: false
  camera-position:
    distance: 1.5
    world: world
    x: -187
    y: 100
    z: 347
    yaw: 190
    pitch: 0.0
  layout:
    title:
      name: "<gold><bold>Toggle diagnostic</bold>"
      x: 0.0
      y: 1.1
      z: 3.5
      text-size: 0.9
    note:
      name: "<gray>Plain should stay ON/OFF. Refresh should survive redraw. Pressed is temporary."
      x: 0.0
      y: 0.78
      z: 3.5
      text-size: 0.43
    plain_toggle:
      name: "[ ] Plain toggle"
      x: -1.05
      y: 0.22
      z: 3.5
      text-size: 0.62
      toggle-content:
        enabled: true
        'off': "[ ] Plain toggle"
        'on': "[x] Plain toggle"
        on-commands:
          - "[actionbar] <green>plain toggle ON"
        off-commands:
          - "[actionbar] <yellow>plain toggle OFF"
      hover-enlarge:
        enabled: true
        scale: 1.08
      hover-style:
        color: "#ffffff"
        underlined: true
      command:
        - "[message] <gray>plain_toggle clicked"
      stop-menu:
        enabled: false
    refresh_toggle:
      name: "[ ] Toggle + refresh"
      x: 1.05
      y: 0.22
      z: 3.5
      text-size: 0.62
      toggle-content:
        enabled: true
        'off': "[ ] Toggle + refresh"
        'on': "[x] Toggle + refresh"
        on-commands:
          - "[actionbar] <green>refresh toggle ON"
        off-commands:
          - "[actionbar] <yellow>refresh toggle OFF"
      refresh-menu:
        enabled: true
        delay: 2
      hover-enlarge:
        enabled: true
        scale: 1.08
      hover-style:
        color: "#ffffff"
        underlined: true
      command:
        - "[message] <gray>refresh_toggle clicked"
      stop-menu:
        enabled: false
    pressed_toggle:
      name: "[ ] Toggle + pressed"
      x: 0.0
      y: -0.38
      z: 3.5
      text-size: 0.62
      toggle-content:
        enabled: true
        'off': "[ ] Toggle + pressed"
        'on': "[x] Toggle + pressed"
        on-commands:
          - "[actionbar] <green>pressed toggle ON"
        off-commands:
          - "[actionbar] <yellow>pressed toggle OFF"
      pressed-style:
        text: "<green>Pressed for 1 second"
        duration: 20
      hover-enlarge:
        enabled: true
        scale: 1.08
      hover-style:
        color: "#ffffff"
        underlined: true
      command:
        - "[message] <gray>pressed_toggle clicked"
      stop-menu:
        enabled: false
    back:
      name: "<aqua>Back to dev12 showcase"
      x: -0.55
      y: -1.12
      z: 3.5
      text-size: 0.56
      hover-enlarge:
        enabled: true
        scale: 1.08
      next-menu:
        enabled: true
        menu: dev12_showcase
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    close:
      name: "<red>Close"
      x: 0.75
      y: -1.12
      z: 3.5
      text-size: 0.56
      hover-enlarge:
        enabled: true
        scale: 1.08
      stop-menu:
        enabled: true
        teleport:
          enabled: false
