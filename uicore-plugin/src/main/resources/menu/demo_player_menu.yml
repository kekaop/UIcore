demo_player_menu:
  permission: ""
  camera-position:
    # fixed (default) uses world/x/y/z. player uses the player's position and view
    # at the moment the menu opens.
    type: player
    distance: 1.5
    offset:
      right: 0.0
      up: 0.0
      forward: 0.0
    yaw-offset: 0.0
    pitch-offset: 0.0
  layout:
    title:
      name: "<gold><bold>Player-relative menu</bold>"
      x: 0.0
      y: 0.75
      z: 3.5
      text-size: 0.75
    description:
      name: "<gray>This menu opens where you are/nand faces the same direction."
      x: 0.0
      y: 0.15
      z: 3.5
      text-size: 0.45
    close:
      name: "<red>Close"
      x: 0.0
      y: -0.65
      z: 3.5
      text-size: 0.55
      hover-style:
        color: "#ff7777"
        underlined: true
      stop-menu:
        enabled: true
        teleport:
          enabled: true
          back-original: true
