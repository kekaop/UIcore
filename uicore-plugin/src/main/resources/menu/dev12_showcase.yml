dev12_showcase:
  permission: ""
  auto-commands:
    enabled: true
    commands:
      - "[actionbar] <green>DEV12 showcase: hover, click, events, conditions, animation, input, items."
    delays:
      - 5
  camera-position:
    distance: 1.5
    world: world
    x: -187
    y: 100
    z: 347
    yaw: 190
    pitch: 0.0
  layout:
    title:
      name: "<gold><bold>UIcore dev12</bold>"
      x: 0.0
      y: 1.25
      z: 3.5
      text-size: 1.0
      animation:
        type: bounce
        speed: 0.9
        amplitude: 0.08
    subtitle:
      name: "<gray>One menu set for every new local feature."
      x: 0.0
      y: 0.91
      z: 3.5
      text-size: 0.52
      animation:
        type: fade
        speed: 0.55
        amplitude: 0.25
    conditions:
      name: "<aqua>Conditions"
      x: -1.25
      y: 0.32
      z: 3.5
      text-size: 0.78
      hover-enlarge:
        enabled: true
        scale: 1.12
      hover-style:
        color: "#ffffff"
        underlined: true
        transition:
          type: smooth
          duration: 6
      pressed-style:
        text: "<green>Opening conditions..."
        color: "#62e67a"
        duration: 5
      hover-cursor:
        enabled: true
        material: AMETHYST_SHARD
        scale: 1.15
      hover-tooltip:
        type: actionbar
        text: "<aqua>visible-if, placeholders, permission and state"
      next-menu:
        enabled: true
        menu: dev12_conditions
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    animations:
      name: "<light_purple>Animations"
      x: 0.0
      y: 0.32
      z: 3.5
      text-size: 0.78
      hover-enlarge:
        enabled: true
        scale: 1.12
      hover-style:
        color: "#ffffff"
        underlined: true
      pressed-style:
        text: "<green>Opening animation lab..."
        color: "#62e67a"
        duration: 5
      hover-cursor:
        enabled: true
        material: BLAZE_POWDER
        scale: 1.15
      next-menu:
        enabled: true
        menu: dev12_animations
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    input_items:
      name: "<green>Input + Items"
      x: 1.25
      y: 0.32
      z: 3.5
      text-size: 0.78
      hover-enlarge:
        enabled: true
        scale: 1.12
      hover-style:
        color: "#ffffff"
        underlined: true
      hover-cursor:
        enabled: true
        material: WRITABLE_BOOK
        scale: 1.15
      next-menu:
        enabled: true
        menu: dev12_input_items
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    permission_button:
      permission: uicore.demo.secret
      name: "<yellow>Permission style"
      x: -1.05
      y: -0.34
      z: 3.5
      text-size: 0.68
      style:
        color: "#facc15"
      permission-style:
        allowed:
          color: "#62e67a"
          bold: true
        denied:
          color: "#777777"
          strikethrough: true
      permission-denied:
        message: "<red>You do not have uicore.demo.secret."
        actionbar: "<gray>Permission denied command hook executed."
        commands:
          - "[message] <gray>permission-denied.commands example"
      command:
        - "[message] <green>Permission button accepted."
      stop-menu:
        enabled: false
    event_note:
      name: "<white>Event API note"
      x: 0.0
      y: -0.34
      z: 3.5
      text-size: 0.68
      hover-enlarge:
        enabled: true
        scale: 1.08
      hover-style:
        color: "#ffffff"
        underlined: true
      command:
        - "[message] <aqua>Events fire for open/close/switch/hover/click/input. Listen from another plugin."
      stop-menu:
        enabled: false
    close:
      name: "<red>Close"
      x: 1.05
      y: -0.34
      z: 3.5
      text-size: 0.68
      hover-enlarge:
        enabled: true
        scale: 1.08
      stop-menu:
        enabled: true
        teleport:
          enabled: false

dev12_conditions:
  permission: ""
  camera-position:
    distance: 1.5
    world: world
    x: -187
    y: 100
    z: 347
    yaw: 190
    pitch: 0.0
  layout:
    title:
      name: "<aqua><bold>Conditions</bold>"
      x: 0.0
      y: 1.25
      z: 3.5
      text-size: 0.96
    hint:
      name: "<gray>Click input field, type <white>open</white> in chat, then watch visible-if refresh."
      x: 0.0
      y: 0.92
      z: 3.5
      text-size: 0.46
    code_input:
      type: input-field
      name: "<yellow>Code: <white>{input.dev12_code}"
      field: dev12_code
      x: -1.05
      y: 0.45
      z: 3.5
      text-size: 0.64
      input-field:
        prompt: "<yellow>Type <white>open</white> in chat."
      hover-enlarge:
        enabled: true
        scale: 1.08
      pressed-style:
        text: "<green>Waiting for chat..."
        duration: 8
      stop-menu:
        enabled: false
    input_locked:
      name: "<red>Input gate is closed"
      x: 0.95
      y: 0.45
      z: 3.5
      text-size: 0.64
      visible-if:
        not:
          placeholder: "%input_dev12_code%"
          equals: open
    input_open:
      name: "<green>Input gate is open"
      x: 0.95
      y: 0.45
      z: 3.5
      text-size: 0.64
      visible-if:
        placeholder: "%input_dev12_code%"
        equals: open
      animation:
        type: scale
        speed: 1.0
        amplitude: 0.08
    world_ok:
      name: "<green>Visible in world: %player_world%"
      x: -1.05
      y: -0.03
      z: 3.5
      text-size: 0.56
      visible-if:
        placeholder: "%player_world%"
        equals: world
    name_ok:
      name: "<aqua>Placeholder check: %player_name%"
      x: 0.95
      y: -0.03
      z: 3.5
      text-size: 0.56
      visible-if:
        placeholder: "%player_name%"
        not-equals: ""
    secret_visible:
      name: "<gold>Permission visible"
      x: -1.05
      y: -0.48
      z: 3.5
      text-size: 0.56
      visible-if:
        permission: uicore.demo.secret
      command:
        - "[message] <green>You can see this because the permission condition passed."
      stop-menu:
        enabled: false
    secret_missing:
      name: "<dark_gray>Permission hidden button is locked"
      x: -1.05
      y: -0.48
      z: 3.5
      text-size: 0.56
      visible-if:
        not:
          permission: uicore.demo.secret
    state_page_two:
      name: "<light_purple>State page == 2"
      x: 0.95
      y: -0.48
      z: 3.5
      text-size: 0.56
      visible-if:
        state.page: 2
      command:
        - "[message] <light_purple>This is visible after api.setState(player, \"dev12_conditions\", \"page\", \"2\")."
      stop-menu:
        enabled: false
    state_hint:
      name: "<gray>State condition needs API: setState(page=2)."
      x: 0.95
      y: -0.78
      z: 3.5
      text-size: 0.42
    back:
      name: "<aqua>Back"
      x: -0.45
      y: -1.25
      z: 3.5
      text-size: 0.62
      hover-enlarge:
        enabled: true
        scale: 1.08
      next-menu:
        enabled: true
        menu: dev12_showcase
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    close:
      name: "<red>Close"
      x: 0.45
      y: -1.25
      z: 3.5
      text-size: 0.62
      stop-menu:
        enabled: true
        teleport:
          enabled: false

