dev12_input_items:
  permission: ""
  camera-position:
    distance: 1.5
    world: world
    x: -187
    y: 100
    z: 347
    yaw: 190
    pitch: 0.0
  layout:
    title:
      name: "<green><bold>Input, items, toggle</bold>"
      x: 0.0
      y: 1.22
      z: 3.5
      text-size: 0.92
    nickname_field:
      type: input-field
      name: "<yellow>Nickname: <white>{input.nickname}"
      field: nickname
      x: -0.95
      y: 0.58
      z: 3.5
      text-size: 0.58
      input-field:
        prompt: "<yellow>Type nickname in chat."
      hover-enlarge:
        enabled: true
        scale: 1.08
      pressed-style:
        text: "<green>Type in chat..."
        duration: 8
      stop-menu:
        enabled: false
    save_nickname:
      name: "<green>Save nickname"
      x: 0.95
      y: 0.58
      z: 3.5
      text-size: 0.58
      hover-enlarge:
        enabled: true
        scale: 1.08
      pressed-style:
        text: "<green>Saved"
        bold: true
        duration: 6
      click-requirements:
        placeholders:
          - placeholder: "%input_nickname%"
            operator: "!="
            value: ""
        denied:
          message: "<red>Type a nickname first."
          actionbar: "<gray>Click the input field."
      command:
        - "[message] <green>Saved nickname: <white>{input.nickname}"
      stop-menu:
        enabled: false
    diamond:
      type: item
      material: DIAMOND
      scale: 0.52
      glow: true
      rotate: true
      rotate-speed: 2.0
      billboard: center
      x: -1.05
      y: -0.08
      z: 3.5
      hitbox:
        width: 0.75
        height: 0.75
        depth: 0.3
      hover-tooltip:
        type: actionbar
        text: "<aqua>Clickable ItemDisplay"
      hover-cursor:
        material: DIAMOND
        scale: 1.15
      command:
        - "[message] <aqua>Diamond item element clicked."
      stop-menu:
        enabled: false
    toggle:
      name: "[ ] Toggle content"
      x: 0.15
      y: -0.08
      z: 3.5
      text-size: 0.62
      toggle-content:
        enabled: true
        'off': "[ ] Toggle content"
        'on': "[x] Toggle content"
        on-commands:
          - "[message] <green>Toggle ON commands."
          - "[actionbar] <green>toggle-content is ON"
        off-commands:
          - "[message] <yellow>Toggle OFF commands."
          - "[actionbar] <yellow>toggle-content is OFF"
      refresh-menu:
        enabled: true
        delay: 2
      hover-enlarge:
        enabled: true
        scale: 1.1
      hover-style:
        color: "#ffffff"
        underlined: true
      command:
        - "[message] <gray>Base toggle click command."
      stop-menu:
        enabled: false
    link:
      name: "<blue>MiniMessage link"
      x: 1.15
      y: -0.08
      z: 3.5
      text-size: 0.58
      hover-enlarge:
        enabled: true
        scale: 1.08
      link: "[link]https://example.com/uicore|<aqua><underlined>Open project page"
      stop-menu:
        enabled: false
    back:
      name: "<aqua>Back"
      x: -0.45
      y: -1.22
      z: 3.5
      text-size: 0.62
      next-menu:
        enabled: true
        menu: dev12_showcase
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    close:
      name: "<red>Close"
      x: 0.45
      y: -1.22
      z: 3.5
      text-size: 0.62
      stop-menu:
        enabled: true
        teleport:
          enabled: false
