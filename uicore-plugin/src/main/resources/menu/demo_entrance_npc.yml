demo_entrance_npc:
  permission: ""
  camera-position:
    type: player
    distance: 1.5
  npc:
    enabled: true
    offset:
      x: 1.4
      y: 0.0
      z: -2.5
    yaw-offset: 180
    pitch: 0
    auto-rotate:
      enabled: false
      speed: 1.0
    sync:
      skin: true
      equipment: true
    name-display:
      show: true
      format: "<yellow>%player%</yellow>"
    custom-model:
      # Enable only when FancyNpcsModel and BetterModel are installed.
      enabled: false
      model: merchant
  layout:
    title:
      name: "<gold><bold>Animated menu</bold>"
      x: 0.0
      y: 0.9
      z: 3.5
      text-size: 0.85
      entrance-animation:
        enabled: true
        from: top
        delay: 0
        duration: 12
        distance: 1.2
    multiline:
      name: "<gray>First line/nSecond line</gray>"
      x: -0.75
      y: 0.2
      z: 3.5
      text-size: 0.5
      entrance-animation:
        enabled: true
        from: left
        delay: 20
        duration: 12
        distance: 1.0
    delayed_message:
      name: "<aqua>Delayed message"
      x: 0.8
      y: 0.2
      z: 3.5
      text-size: 0.55
      command:
        - "<delay=60>[message] <green>This message was delayed by 60 ticks."
      entrance-animation:
        enabled: true
        from: right
        delay: 60
        duration: 12
        distance: 1.0
      stop-menu:
        enabled: false
    close:
      name: "<red>Close"
      x: 0.0
      y: -0.65
      z: 3.5
      text-size: 0.6
      entrance-animation:
        enabled: true
        from: bottom
        delay: 80
        duration: 10
        distance: 0.8
      stop-menu:
        enabled: true
        teleport:
          enabled: false
