demo_toggle_input:
  permission: ""
  wasd-enabled: true
  camera-position:
    type: player
    distance: 1.5
  layout:
    title:
      name: "<green><bold>Toggle and input fields</bold>"
      x: 0.0
      y: 1.18
      z: 3.5
      text-size: 0.82
    nickname_input:
      type: input-field
      name: "<yellow>Nickname: <white>{input.nickname}"
      field: nickname
      x: -0.95
      y: 0.45
      z: 3.5
      text-size: 0.62
      input-field:
        prompt: "<yellow>Type a nickname in chat."
      hover-enlarge:
        enabled: true
        scale: 1.08
      hover-style:
        color: "#ffffff"
        underlined: true
      pressed-style:
        text: "<green>Waiting for chat..."
        duration: 8
      stop-menu:
        enabled: false
    submit_nickname:
      name: "<green>Submit nickname"
      x: 0.95
      y: 0.45
      z: 3.5
      text-size: 0.62
      hover-enlarge:
        enabled: true
        scale: 1.08
      click-requirements:
        placeholders:
          - placeholder: "%input_nickname%"
            operator: "!="
            value: ""
        denied:
          actionbar: "<gray>Click the nickname field first."
          message: "<red>No nickname was entered."
      command:
        - "[message] <green>Submitted nickname: <white>{input.nickname}"
      stop-menu:
        enabled: false
    toggle_check:
      name: "<gray>Agreement"
      x: 0.0
      y: -0.12
      z: 3.5
      text-size: 0.58
      toggle-content:
        enabled: true
        'off': "[ ] Agreement accepted"
        'on': "[x] Agreement accepted"
        on-commands:
          - "[actionbar] <green>Agreement accepted."
        off-commands:
          - "[actionbar] <red>Agreement cleared."
      toggle-style:
        'off':
          color: "#ff6b6b"
          strikethrough: true
        'on':
          color: "#62e67a"
          bold: true
      hover-style:
        underlined: true
      pressed-style:
        text: "<yellow>Switching..."
        duration: 4
      refresh-menu:
        enabled: true
        delay: 3
      stop-menu:
        enabled: false
    temporary_text:
      name: "<aqua>Temporary pressed text"
      x: 0.0
      y: -0.5
      z: 3.5
      text-size: 0.56
      hover-enlarge:
        enabled: true
        scale: 1.08
      pressed-style:
        text: "<green>Saved!"
        color: "#62e67a"
        duration: 8
      command:
        - "[message] <gray>pressed-style.text is temporary."
      stop-menu:
        enabled: false
    back:
      name: "<yellow>Back"
      x: -0.45
      y: -0.92
      z: 3.5
      text-size: 0.62
      hover-enlarge:
        enabled: true
        scale: 1.08
      next-menu:
        enabled: true
        menu: demo_main
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    close:
      name: "<red>Close"
      x: 0.55
      y: -0.92
      z: 3.5
      text-size: 0.62
      hover-enlarge:
        enabled: true
        scale: 1.08
      stop-menu:
        enabled: true
        teleport:
          enabled: false
