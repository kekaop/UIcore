demo_main:
  permission: ""
  camera-position:
    type: player
    distance: 1.5
  layout:
    title:
      name: "<gold><bold>UIcore Patch Demo</bold>"
      x: 0.0
      y: 1.18
      z: 3.5
      text-size: 0.88
    subtitle:
      name: "<gray>Clean English examples for the patched feature set."
      x: 0.0
      y: 0.86
      z: 3.5
      text-size: 0.48
    styles:
      name: "<aqua>Styles + hover"
      x: -1.45
      y: 0.32
      z: 3.5
      text-size: 0.56
      hover-enlarge:
        enabled: true
        scale: 1.1
      hover-style:
        color: "#ffffff"
        underlined: true
        transition:
          type: smooth
          duration: 6
      pressed-style:
        text: "<green>Opening styles..."
        duration: 5
      hover-tooltip:
        type: actionbar
        text: "<aqua>Hover colors, cursor, tooltip, permission style, pressed style."
      next-menu:
        enabled: true
        menu: demo_styles
      stop-menu:
        enabled: true
        teleport:
          enabled: false
    toggle_input:
